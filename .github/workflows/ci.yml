name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The point of running on all three is that shao has two separate capture
  # implementations behind build tags -- the Windows pseudoconsole and the
  # POSIX pty -- and building on one proves nothing about the other. Until
  # this workflow runs, the POSIX path has only ever been compiled, never
  # executed.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...

  # Every release target has to keep compiling, including the ones no test
  # job covers. This also produces downloadable builds of main, so a server
  # can be given a binary before any version has been tagged -- the artifact
  # is retained for 14 days and is reachable from the run's summary page.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/release.sh reads `git describe`
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: bash scripts/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: shao-dist
          path: dist/
          retention-days: 14
